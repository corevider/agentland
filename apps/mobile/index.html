<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0b1113" />
        <link rel="manifest" href="/mobile/manifest.webmanifest" />
        <title>Agentland</title>
        <style>
            :root {
                color-scheme: dark;
                --ground: #0d1c1f;
                --surface: #12262a;
                --line: #24454d;
                --ink: #eef0e6;
                --muted: #91a3a1;
                --accent: #46bfb0;
                --good: #6fbf73;
                --warn: #f0a95c;
                --bad: #e5705f;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background:
                    radial-gradient(120% 70% at 50% -10%, #17323740 0%, transparent 60%),
                    var(--ground);
                color: var(--ink);
                font: 16px/1.5 system-ui, -apple-system, sans-serif;
                padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
            }

            header {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
                padding: 14px 16px;
                border-bottom: 1px solid var(--line);
            }

            h1 {
                margin: 0;
                font-size: 15px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--accent);
            }

            main {
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 22px;
            }

            h2 {
                margin: 0 0 10px;
                font-size: 12px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--muted);
            }

            .card {
                border: 1px solid var(--line);
                background: var(--surface);
                padding: 12px 14px;
                margin-bottom: 10px;
                border-radius: 12px;
            }

            .row {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }

            .detail {
                color: var(--muted);
                font-size: 13px;
                margin-top: 4px;
                white-space: pre-wrap;
            }

            .actions {
                display: flex;
                gap: 10px;
                margin-top: 12px;
            }

            button {
                flex: 1;
                padding: 12px;
                border-radius: 10px;
                font: inherit;
                font-size: 15px;
                background: transparent;
                border: 1px solid var(--line);
                color: var(--ink);
            }

            button.approve {
                border-color: var(--good);
                color: var(--good);
            }

            button.reject {
                border-color: var(--bad);
                color: var(--bad);
            }

            button:disabled {
                opacity: 0.4;
            }

            .state {
                font-size: 12px;
                font-family: ui-monospace, monospace;
            }

            .done { color: var(--good); }
            .working { color: var(--warn); }
            .attention { color: var(--bad); }
            .idle { color: var(--muted); }

            .empty {
                color: var(--muted);
                font-size: 14px;
            }

            .notice {
                border: 1px solid var(--bad);
                color: var(--bad);
                padding: 10px 12px;
                font-size: 14px;
            }

            .card.opens {
                cursor: pointer;
            }

            .chev {
                margin-left: auto;
                color: var(--muted);
                font-size: 12px;
                font-family: ui-monospace, monospace;
            }

            .knows {
                margin-top: 12px;
                border-top: 1px solid var(--line);
                padding-top: 10px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .skill strong {
                font-size: 14px;
                font-weight: 600;
            }

            .skill .when {
                color: var(--accent);
                font-size: 13px;
                margin-top: 2px;
            }

            .skill .says {
                color: var(--muted);
                font-size: 13px;
                margin-top: 4px;
                white-space: pre-wrap;
            }
        </style>
        <style>
            #voice textarea {
                width: 100%;
                box-sizing: border-box;
                font: inherit;
                padding: 0.6rem;
                border-radius: 0.6rem;
                border: 1px solid #1f3d3a;
                background: #04100f;
                color: inherit;
            }

            #voice .row {
                display: flex;
                gap: 0.5rem;
                margin-top: 0.5rem;
                align-items: center;
            }

            #voice select {
                flex: 1;
                font: inherit;
                padding: 0.5rem;
                border-radius: 0.6rem;
                border: 1px solid #1f3d3a;
                background: #04100f;
                color: inherit;
            }

            #record.listening {
                border-color: #f4737b;
                color: #f4737b;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Agentland</h1>
            <span class="state" id="clock"></span>
        </header>

        <main>
            <section>
                <h2>Say something</h2>
                <div id="voice">
                    <textarea id="said" rows="3" placeholder="Tap the microphone on your keyboard, or hold the button below."></textarea>
                    <div class="row">
                        <button id="record" class="approve" hidden>hold to speak</button>
                        <select id="whom"><option value="">the project&apos;s goal</option></select>
                        <button id="send" class="approve">send</button>
                    </div>
                    <p class="empty" id="voice-note">The machine running the crew has no microphone; this one does.</p>
                </div>
            </section>

            <section>
                <h2>Waiting for you</h2>
                <div id="approvals"><p class="empty">Nothing to answer.</p></div>
            </section>

            <section>
                <h2>Crew</h2>
                <div id="crew"><p class="empty">No crew yet.</p></div>
            </section>

            <section>
                <h2>Board</h2>
                <div id="board"><p class="empty">No cards.</p></div>
            </section>
        </main>

        <script type="module">
            const params = new URLSearchParams(location.search);
            const stored = localStorage.getItem("agentland-mobile-token");
            const token = params.get("token") ?? stored ?? "";

            if (params.get("token")) {
                localStorage.setItem("agentland-mobile-token", params.get("token"));
                history.replaceState({}, "", location.pathname);
            }

            async function api(path, options = {}) {
                const response = await fetch(path, {
                    ...options,
                    headers: {
                        "content-type": "application/json",
                        "x-auth-token": token,
                        ...(options.headers ?? {}),
                    },
                });

                if (!response.ok) {
                    throw new Error(`${response.status} ${await response.text()}`);
                }

                return response.status === 204 ? null : response.json();
            }

            function element(html) {
                const holder = document.createElement("div");
                holder.innerHTML = html.trim();
                return holder.firstElementChild;
            }

            function escape(value) {
                return String(value).replace(/[&<>"]/g, (character) => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                })[character]);
            }

            async function answer(id, approved) {
                await api(`/approvals/${id}`, {
                    method: "POST",
                    body: JSON.stringify({ approved }),
                });
                await refresh();
            }

            function render_approvals(items) {
                const holder = document.getElementById("approvals");
                const pending = items.filter((item) => item.verdict === "pending");

                if (pending.length === 0) {
                    holder.innerHTML = '<p class="empty">Nothing to answer.</p>';
                    return;
                }

                holder.innerHTML = "";
                for (const item of pending) {
                    const card = element(`
                        <div class="card">
                            <div class="row"><strong>${escape(item.summary)}</strong></div>
                            <div class="detail">asked by ${escape(item.requested_by)}${
                                item.detail ? `\n${escape(item.detail)}` : ""
                            }</div>
                            <div class="actions">
                                <button class="approve">Approve</button>
                                <button class="reject">Reject</button>
                            </div>
                        </div>
                    `);

                    card.querySelector(".approve").addEventListener("click", () => answer(item.id, true));
                    card.querySelector(".reject").addEventListener("click", () => answer(item.id, false));
                    holder.append(card);
                }
            }

            const skills_of = new Map();
            const opened = new Set();

            async function toggle_skills(agent_id) {
                if (opened.has(agent_id)) {
                    opened.delete(agent_id);
                } else {
                    opened.add(agent_id);
                    if (!skills_of.has(agent_id)) {
                        skills_of.set(agent_id, "loading");
                        try {
                            skills_of.set(
                                agent_id,
                                await api(`/agents/${encodeURIComponent(agent_id)}/skills`),
                            );
                        } catch (cause) {
                            skills_of.set(agent_id, cause.message);
                        }
                    }
                }

                render_crew(last_agents);
            }

            function render_skills(agent_id) {
                if (!opened.has(agent_id)) {
                    return "";
                }

                const held = skills_of.get(agent_id);

                if (held === "loading") {
                    return '<div class="knows"><span class="empty">Reading…</span></div>';
                }

                if (typeof held === "string") {
                    return `<div class="knows"><span class="empty">${escape(held)}</span></div>`;
                }

                if (!held || held.length === 0) {
                    return '<div class="knows"><span class="empty">No skills yet. Give it one from the desktop.</span></div>';
                }

                return `<div class="knows">${held
                    .map(
                        (skill) => `
                        <div class="skill">
                            <strong>${escape(skill.name)}</strong>
                            <div class="when">Uses it when: ${escape(skill.when_to_use)}</div>
                            <div class="says">${escape(skill.description)}</div>
                        </div>`,
                    )
                    .join("")}</div>`;
            }

            let last_agents = [];

            function render_crew(agents) {
                last_agents = agents;
                const holder = document.getElementById("crew");
                if (agents.length === 0) {
                    holder.innerHTML = '<p class="empty">No crew yet.</p>';
                    return;
                }

                holder.innerHTML = agents
                    .map(
                        (agent) => `
                        <div class="card opens" data-agent="${escape(agent.id)}">
                            <div class="row">
                                <strong>${escape(agent.name)}</strong>
                                <span class="state ${agent.presence}">${escape(agent.presence === "attention" ? "needs you" : agent.presence)}</span>
                                <span class="chev">${opened.has(agent.id) ? "hide skills" : "skills"}</span>
                            </div>
                            <div class="detail">${escape(agent.role)} · ${escape(agent.engine_id)} · ${escape(
                                agent.repository_id,
                            )}/${escape(agent.worktree)}</div>
                            ${render_skills(agent.id)}
                        </div>`,
                    )
                    .join("");

                for (const card of holder.querySelectorAll("[data-agent]")) {
                    card.addEventListener("click", () => toggle_skills(card.dataset.agent));
                }
            }

            function render_board(tasks) {
                const holder = document.getElementById("board");
                const live = tasks.filter((task) => task.column !== "done");

                if (live.length === 0) {
                    holder.innerHTML = '<p class="empty">No cards.</p>';
                    return;
                }

                holder.innerHTML = live
                    .map(
                        (task) => `
                        <div class="card">
                            <div class="row">
                                <strong>${escape(task.title)}</strong>
                                <span class="state">${escape(task.column)}</span>
                            </div>
                            <div class="detail">${escape(task.assignee ?? "unassigned")}${
                                task.branch ? ` · ${escape(task.branch)}` : ""
                            }</div>
                        </div>`,
                    )
                    .join("");
            }

            // Speaking from the phone, because the machine running the crew has
            // no microphone: over a remote desktop there is nothing to record,
            // and this device has a better one anyway.
            const said = document.getElementById("said");
            const whom = document.getElementById("whom");
            const record = document.getElementById("record");
            const voice_note = document.getElementById("voice-note");

            // getUserMedia needs a secure page. Over plain http on a home
            // network there is none, so the keyboard's own dictation is the way
            // in and the button stays hidden rather than failing when pressed.
            const can_record = Boolean(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
            record.hidden = !can_record;

            if (!can_record) {
                voice_note.textContent =
                    "Use the microphone on your keyboard — this page cannot open one over plain http.";
            }

            let recorder = null;
            let chunks = [];

            async function begin() {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                chunks = [];
                recorder = new MediaRecorder(stream);
                recorder.ondataavailable = (event) => chunks.push(event.data);
                recorder.onstop = async () => {
                    stream.getTracks().forEach((track) => track.stop());
                    const audio = new Blob(chunks, { type: recorder.mimeType });
                    voice_note.textContent = "reading it back…";

                    try {
                        const answer = await fetch("/voice/heard", {
                            method: "POST",
                            headers: { "content-type": recorder.mimeType, "x-auth-token": token },
                            body: audio,
                        });

                        const heard = await answer.json();
                        if (!answer.ok) {
                            throw new Error(heard.error ?? "the recording could not be read");
                        }

                        said.value = heard.text ? `${said.value} ${heard.text}`.trim() : said.value;
                        voice_note.textContent = heard.text ? "read it, then send it." : "nothing was said.";
                    } catch (cause) {
                        voice_note.textContent = String(cause.message ?? cause);
                    }
                };

                recorder.start();
                record.classList.add("listening");
                record.textContent = "listening…";
            }

            function end() {
                if (recorder && recorder.state !== "inactive") {
                    recorder.stop();
                }

                record.classList.remove("listening");
                record.textContent = "hold to speak";
            }

            record.addEventListener("pointerdown", () => {
                begin().catch((cause) => {
                    voice_note.textContent = String(cause.message ?? cause);
                });
            });
            record.addEventListener("pointerup", end);
            record.addEventListener("pointercancel", end);

            document.getElementById("send").addEventListener("click", async () => {
                const text = said.value.trim();
                if (!text) {
                    return;
                }

                try {
                    await api("/voice/said", {
                        method: "POST",
                        body: JSON.stringify({ text, to: whom.value || undefined }),
                    });

                    said.value = "";
                    voice_note.textContent = whom.value
                        ? `told ${whom.value}.`
                        : "it is the project's goal now.";
                } catch (cause) {
                    voice_note.textContent = String(cause.message ?? cause);
                }
            });

            /// Who the words can go to: an agent with a pane open, or nobody,
            /// which makes them the project's goal.
            function render_whom(agents) {
                const open = agents.filter((agent) => agent.session_id);
                const chosen = whom.value;

                whom.innerHTML = "";
                whom.append(new Option("the project's goal", ""));

                for (const agent of open) {
                    whom.append(new Option(`${agent.name} · ${agent.role ?? ""}`.trim(), agent.id));
                }

                if (chosen && open.some((agent) => agent.id === chosen)) {
                    whom.value = chosen;
                }
            }

            async function refresh() {
                try {
                    const [approvals, agents, tasks] = await Promise.all([
                        api("/approvals"),
                        api("/agents"),
                        api("/tasks"),
                    ]);

                    render_approvals(approvals);
                    render_crew(agents);
                    render_whom(agents);
                    render_board(tasks);
                    document.getElementById("clock").textContent = new Date().toLocaleTimeString();
                } catch (cause) {
                    document.querySelector("main").prepend(
                        element(`<div class="notice">${escape(cause.message)}</div>`),
                    );
                }
            }

            refresh();
            setInterval(refresh, 5000);
        </script>
    </body>
</html>
