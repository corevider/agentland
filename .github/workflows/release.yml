name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A tag that disagrees with the version in the tree breaks the update check
  # silently: the app would keep offering an update the person already has, or
  # refuse one they need. It is cheap to check and expensive to miss, so it runs
  # once before anything is built.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nothing that looks like a credential
        run: bash scripts/scan-for-secrets.sh

      - name: The versions agree with each other
        run: node scripts/check-version.js

      - name: And with the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -e "console.log(require('./apps/desktop/src-tauri/tauri.conf.json').version)")
          echo "tag=$tag  tauri.conf.json=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag $tag is not version $ver"; exit 1; }

  release:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes are built from the log since the last tag

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install
        working-directory: apps/desktop
        run: npm ci

      - name: What changed since the last tag
        id: notes
        shell: bash
        run: bash scripts/release/notes.sh > "$RUNNER_TEMP/notes.md"

      # Builds, signs with the updater key, uploads the bundles, and writes the
      # latest.json the app reads. Signing is what makes an update trustworthy:
      # without the private key the bundles ship unsigned and every client
      # refuses them, which is the right way round.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body || '' }}
          releaseBodyPath: ${{ runner.temp }}/notes.md
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
