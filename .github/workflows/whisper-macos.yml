# The macOS build of whisper.cpp that nobody publishes.
#
# whisper.cpp ships command-line builds for Windows and Linux and an
# xcframework for Apple platforms, so a mac had nothing Agentland could fetch
# and voice ended there. This builds one and puts it on a release of its own —
# a fixed tag, not Agentland's, so the download URL does not move every time
# Agentland ships and an old copy of the app can still find it.
#
# Run by hand when the pinned whisper.cpp version in crates/core/src/whisper.rs
# changes, and never otherwise.
name: whisper for macos

on:
  workflow_dispatch:
    inputs:
      whisper:
        description: "The whisper.cpp tag to build"
        required: true
        default: "v1.9.2"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            architectures: arm64
            native: true
          # Intel is cross-compiled from the arm64 runner: GitHub retired the
          # macos-13 image, and a job that waits forever for a runner that is
          # not coming is worse than a build nobody can smoke-test on the way
          # out. It is the same source and the same flags.
          - arch: x64
            architectures: x86_64
            native: false
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Take whisper.cpp at the pinned tag
        run: git clone --depth 1 --branch "${{ inputs.whisper }}" https://github.com/ggml-org/whisper.cpp.git

      # The Metal shaders are embedded rather than left beside the binary: a
      # tarball that has to keep a .metallib next to the tool is a tarball that
      # half-works the moment anything moves.
      #
      # `GGML_NATIVE=OFF` because this is built for other people's machines,
      # not this runner's. Left on, ggml tunes for the host CPU — which is how
      # the Intel build died, with the arm64 runner handing `-mcpu=apple-m1` to
      # an x86 compiler that has never heard of it.
      - name: Build the command-line tool
        working-directory: whisper.cpp
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architectures }} \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build --config Release --target whisper-cli -j 3

      # The tool and the libraries it loads, flattened into one folder, with
      # the load paths rewritten to look beside the binary rather than at the
      # build directory that will not exist on anybody else's machine.
      - name: Gather what it needs to run
        working-directory: whisper.cpp
        run: |
          out="whisper-bin-macos-${{ matrix.arch }}"
          mkdir -p "$out"
          cp build/bin/whisper-cli "$out/"
          find build -name "*.dylib" -exec cp {} "$out/" \;

          cd "$out"
          for lib in *.dylib; do
            install_name_tool -id "@rpath/$lib" "$lib" || true
            for other in *.dylib; do
              install_name_tool -change "@rpath/$other" "@loader_path/$other" "$lib" || true
            done
          done
          for other in *.dylib; do
            install_name_tool -change "@rpath/$other" "@loader_path/$other" whisper-cli || true
          done
          install_name_tool -add_rpath "@loader_path" whisper-cli || true

          otool -L whisper-cli
          file whisper-cli | grep -q "${{ matrix.architectures }}" || {
            echo "::error::built for the wrong architecture"; exit 1;
          }

          # Only where it can be: nothing on an arm64 runner can start an
          # Intel binary, so that one is checked for what it is instead.
          if [ "${{ matrix.native }}" = "true" ]; then
            ./whisper-cli --help > /dev/null && echo "it runs"
          fi

      - name: Pack it
        working-directory: whisper.cpp
        run: tar -czf "whisper-bin-macos-${{ matrix.arch }}.tar.gz" "whisper-bin-macos-${{ matrix.arch }}"

      - name: Put it where the app looks for it
        uses: softprops/action-gh-release@v2
        with:
          tag_name: whisper-${{ inputs.whisper }}
          name: whisper.cpp ${{ inputs.whisper }} for macOS
          body: |
            The macOS command-line build of whisper.cpp ${{ inputs.whisper }},
            which whisper.cpp itself does not publish. Agentland fetches this
            when voice is set up on a mac. Built by `.github/workflows/whisper-macos.yml`.
          files: whisper.cpp/whisper-bin-macos-${{ matrix.arch }}.tar.gz
          draft: false
          prerelease: false
