[workspace]
resolver = "2"
members = ["crates/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }
parking_lot = "0.12"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
crossterm = "0.28"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
vt100 = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
